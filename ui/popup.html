<!DOCTYPE html>
<html>
<head>
    <title>Emucord</title>
    <style>
        body { width: 300px; padding: 10px; font-family: sans-serif; }
        .tab { margin-bottom: 10px; }
        button { margin: 5px 0; padding: 5px 10px; }
        textarea { width: 100%; height: 100px; }
    </style>
</head>
<body>
    <h2>Emucord</h2>
    
    <div class="tab" id="plugins-tab">
        <h3>Plugins</h3>
        <button id="add-plugin">Add Plugin</button>
        <div id="plugin-list"></div>
    </div>
    
    <div class="tab" id="themes-tab">
        <h3>Themes</h3>
        <button id="add-theme">Add Theme</button>
        <div id="theme-list"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
